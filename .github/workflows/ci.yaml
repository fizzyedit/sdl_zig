name: CI

on:
  push:
    branches:
      - main
      - fizzy
  pull_request:
    branches:
      - main
      - fizzy
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zig-version: [0.16.0, master]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.zig-version == 'master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Workaround Zig 0.16.0 ZIP unpack failure
        # https://codeberg.org/ziglang/zig/issues/31964
        shell: bash
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Check Formatting
        if: runner.os != 'Windows' # zig fmt failing on Windows CI, unclear why
        run: zig fmt --ast-check --check .

      - name: Build for Windows
        run: zig build example -Dtarget=x86_64-windows-gnu --summary all

      - name: Build for Linux
        run: zig build example -Dtarget=x86_64-linux-gnu --summary all

      - name: Build for macOS
        if: runner.os == 'macOS'
        # We don't support cross compiling for macOS, so don't set a target just build
        # the native target
        run: zig build example --summary all

      - name: Build for iOS
        if: runner.os == 'macOS'
        # The iOS SDK is not bundled with Zig, so point the build at Xcode's iPhoneOS SDK.
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          zig build -Dtarget=aarch64-ios -Dinclude_path="$SDK/usr/include" -Dframework_path="$SDK/System/Library/Frameworks" --summary all

  # fizzyedit/SDL's suites for fizzy's patches (`zig build test-fizzy`). Vulkan is Mesa's software
  # driver, lavapipe, on a display with no screen: Xvfb for X11, headless weston for Wayland.
  #
  # In an Ubuntu 26.04 container, not on the 24.04 runner: this package builds SDL against
  # libxkbcommon 1.13's headers, so SDL's Wayland driver needs `xkb_keymap_mod_get_mask` (1.10+)
  # at run time, and 24.04 ships libxkbcommon 1.6. There the Wayland driver doesn't load.
  test-fizzy-linux:
    strategy:
      fail-fast: false
      matrix:
        video: [x11, wayland]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install tools, lavapipe and a headless display
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils \
            mesa-vulkan-drivers libvulkan1 vulkan-tools \
            xvfb xauth weston \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxfixes3 libxss1 libxtst6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libdecor-0-0
          dpkg-query -W libxkbcommon0 libwayland-client0 mesa-vulkan-drivers weston
          ls /usr/share/vulkan/icd.d
          # The manifest's name moves between Mesa releases (lvp_icd.json, lvp_icd.x86_64.json)
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Workaround Zig 0.16.0 ZIP unpack failure
        # https://codeberg.org/ziglang/zig/issues/31964
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Build test-fizzy
        run: zig build test-fizzy --summary all -- --list

      - name: Run test-fizzy on X11 (Xvfb)
        if: matrix.video == 'x11'
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" vulkaninfo --summary
          xvfb-run -a -s "-screen 0 1280x1024x24" zig build test-fizzy --summary all -- --require-gpu vulkan

      - name: Run test-fizzy on Wayland (headless weston)
        if: matrix.video == 'wayland'
        env:
          SDL_VIDEO_DRIVER: wayland
          WAYLAND_DISPLAY: wayland-fizzy
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket="$WAYLAND_DISPLAY" --idle-time=0 &
          weston_pid=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.1; done
          vulkaninfo --summary
          zig build test-fizzy --summary all -- --require-gpu vulkan
          kill "$weston_pid"

  # fizzyedit/SDL's suite for patch 6, Wayland frame insets (`FizzyWayland`). It reads the requests
  # SDL sends from libwayland's own trace (WAYLAND_DEBUG), so it needs a real compositor: weston's
  # headless backend, with its default desktop shell, which maximizes and fullscreens. At output
  # scale 1 and 2, as the insets are in window coordinates whatever the scale. lavapipe presents
  # the frames that map the windows. Ubuntu 26.04 for the same libxkbcommon reason as above.
  test-fizzy-wayland-insets:
    strategy:
      fail-fast: false
      matrix:
        scale: [1, 2]
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install tools, lavapipe and weston
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils \
            mesa-vulkan-drivers libvulkan1 weston \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0
          dpkg-query -W libwayland-client0 mesa-vulkan-drivers weston
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Workaround Zig 0.16.0 ZIP unpack failure
        # https://codeberg.org/ziglang/zig/issues/31964
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Build test-fizzy
        run: zig build test-fizzy --summary all -- --list

      - name: Run FizzyWayland under headless weston (scale ${{ matrix.scale }})
        env:
          SDL_VIDEO_DRIVER: wayland
          WAYLAND_DISPLAY: wayland-fizzy
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --scale=${{ matrix.scale }} --socket="$WAYLAND_DISPLAY" --idle-time=0 > weston.log 2>&1 &
          weston_pid=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.1; done
          status=0
          zig build test-fizzy --summary all -- --filter FizzyWayland || status=$?
          kill "$weston_pid" || true
          echo "--- weston.log"
          cat weston.log
          exit "$status"

  # Do GitHub's hosted macOS runners have a Metal device? The probe says, and the suite requires
  # Metal wherever the probe found one, so a runner with Metal can't skip the Metal tests. (On
  # macos-14, MTLCreateSystemDefaultDevice() is nil from a command-line tool though
  # MTLCopyAllDevices() lists the paravirtual GPU, and SDL's Metal driver works; hence the list.)
  test-fizzy-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Workaround Zig 0.16.0 ZIP unpack failure
        # https://codeberg.org/ziglang/zig/issues/31964
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Displays
        run: |
          sw_vers
          uname -m
          system_profiler SPDisplaysDataType

      - name: Metal probe
        id: probe
        run: |
          cat > metal_probe.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void)
          {
              @autoreleasepool {
                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  NSArray<id<MTLDevice>> *all = MTLCopyAllDevices();
                  printf("MTLCreateSystemDefaultDevice: %s\n", device ? device.name.UTF8String : "nil");
                  printf("MTLCopyAllDevices: %lu\n", (unsigned long)all.count);
                  for (id<MTLDevice> d in all) {
                      printf("  %s (low power: %d, headless: %d)\n", d.name.UTF8String, d.lowPower, d.headless);
                  }
                  return all.count > 0 ? 0 : 1;
              }
          }
          EOF
          clang -fobjc-arc metal_probe.m -framework Foundation -framework Metal -o metal_probe
          if ./metal_probe; then
            echo "args=--require-gpu metal" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.os }}: no Metal device"
          fi

      - name: Run test-fizzy
        run: zig build test-fizzy --summary all -- ${{ steps.probe.outputs.args }}

  # fizzyedit/SDL's FizzyXkb suite: SDL's Wayland driver loads, and builds its keymap's modifier
  # levels right, on the oldest supported distribution as well as a current one. This package
  # builds SDL against libxkbcommon 1.13's headers; Ubuntu 24.04 ships libxkbcommon 1.6, which
  # lacks `xkb_keymap_mod_get_mask` (1.10), 26.04 has 1.13. So 24.04 runs SDL's fallback that
  # builds the modifier masks from their indices, and 26.04 the 1.10 path.
  #
  # Weston runs on its X11 backend inside Xvfb rather than headless: the headless backend has
  # no seat, the X11 one has a keyboard with the X server's layout, and the suite checks German
  # (de) levels.
  test-fizzy-xkb:
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:24.04", "ubuntu:26.04"]
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    steps:
      - name: Install tools, Xvfb and weston
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils \
            xvfb xauth x11-xkb-utils x11-xserver-utils xkb-data weston \
            libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxfixes3 libxss1 libxtst6 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libxkbcommon0 libdecor-0-0
          dpkg-query -W libxkbcommon0 libwayland-client0 weston

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Workaround Zig 0.16.0 ZIP unpack failure
        # https://codeberg.org/ziglang/zig/issues/31964
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR}/tmp"

      - name: Build test-fizzy
        run: zig build test-fizzy --summary all -- --list

      - name: Run FizzyXkb on Wayland (weston's X11 backend in Xvfb, de layout)
        env:
          DISPLAY: ":99"
          WAYLAND_DISPLAY: wayland-fizzy
          FIZZY_TEST_XKB_LAYOUT: de
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          Xvfb "$DISPLAY" -screen 0 1280x1024x24 -nolisten tcp -noreset &
          xvfb_pid=$!
          for i in $(seq 50); do xset q >/dev/null 2>&1 && break; sleep 0.1; done
          # Weston's X11 backend builds its keymap from the layout setxkbmap sets on the root
          # window. -noreset, or Xvfb resets the layout each time its last client disconnects.
          setxkbmap -layout de
          setxkbmap -query
          weston --backend=x11 --renderer=pixman --width=1024 --height=768 \
            --socket="$WAYLAND_DISPLAY" --idle-time=0 &
          weston_pid=$!
          for i in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ] && break; sleep 0.1; done
          zig build test-fizzy --summary all -- --filter FizzyXkb
          kill "$weston_pid" "$xvfb_pid"
